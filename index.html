<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111923"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>My Garage</title><style>
:root{color-scheme:dark;--bg:#111923;--card:#1c2936;--muted:#aab9c7;--accent:#72d7bd;--line:#344555;--text:#f3f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:740px;margin:auto;padding:24px 18px 100px}h1{font-size:32px;letter-spacing:-1.3px;margin:5px 0}h2{font-size:21px;margin:24px 0 12px}h3{font-size:17px;margin:0 0 5px}p{line-height:1.5;margin:8px 0}.muted,small{color:var(--muted)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row>*{min-width:0}.wrap{flex-wrap:wrap}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.number{font-size:25px;font-weight:700;margin-top:6px}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:12px 15px;background:var(--accent);color:#10251f;font-weight:700;cursor:pointer;min-height:44px}button.secondary{background:#2b3c4a;color:var(--text)}button.danger{background:#482b34;color:#ffc4cc}button.tiny{font-size:13px;padding:8px 11px}button:disabled{opacity:.4}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#13202b;color:var(--text);padding:12px;min-height:45px;margin:5px 0 12px}label{font-size:14px;color:var(--muted);display:block}textarea{min-height:85px;resize:vertical}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:3px;background:#17232f;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;max-width:160px;background:transparent;color:var(--muted);font-size:13px;padding:10px 4px}nav button.active{color:var(--accent);background:#243744}.status{font-size:12px;font-weight:700;border-radius:20px;padding:5px 9px;white-spac </style></head><body><main><header><div class="eyebrow">VEHICLE MAINTENANCE</div><h1>My Garage</h1><p class="muted">Your vehicles. Every mile accounted for.</p></header><div id="vehicleBar"></div><div id="view"></div></main><nav><button data-tab="home" class="active">Overview</button><button data-tab="history">History</button><button data-tab="schedule">Maintenance</button><button data-tab="garage">Garage</button></nav><dialog id="modal"></dialog><input id="importFile" type="file" accept="application/json,.json" hidden><script>
'use strict';
const KEY='my-garage-v1', $=s=>document.querySelector(s), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=n=>n==null?'Not entered':Number(n).toLocaleString('en-US'), cash=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}), datefmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Not entered';
let state={vehicles:[],records:[],rules:[],active:null},tab='home',search='';try{let s=localStorage.getItem(KEY);if(s)state=JSON.parse(s)}catch(e){alert('Saved data could not be read. Export a backup if available.')}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Could not save to device storage. Export a backup before closing.')}render()}
const v=()=>state.vehicles.find(x=>x.id===state.active), records=()=>state.records.filter(x=>x.vid===state.active).sort((a,b)=>b.date.localeCompare(a.date)||b.miles-a.miles), rules=()=>state.rules.filter(x=>x.vid===state.active), btn=(text,action,cls='')=>`<button class="${cls}" data-action="${action}">${text}</button>`, num=(x)=>x===''||x==null?null:Number(x);
const presets=['Oil & filter change','Tire rotation','Front brake inspection','Rear brake inspection','Front brake pads','Rear brake pads','Front brake rotors','Rear brake rotors','Front brake calipers','Rear brake calipers','Parking brake shoes','Brake fluid','Engine air filter','Cabin air filter','Transmission fluid','Coolant','Battery','Spark plugs','Differential fluid','Transfer case fluid','Other'];
function addMonths(s,n){let d=new Date(s+'T12:00:00'), day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function status(r){let last=records().find(x=>x.task.trim().toLowerCase()===r.task.trim().toLowerCase()), dm=r.miles&&last?.miles!=null?last.miles+r.miles:null, dd=r.months&&last?.date?addMonths(last.date,r.months):null, ml=dm!=null&&v()?.miles!=null?dm-v().miles:null, days=dd?Math.round((new Date(dd+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):null;let level=(ml!=null&&ml<=0)||(days!=null&&days<=0)?'due':(ml!=null&&ml<=500)||(days!=null&&days<=30)?'soon':(!last||(r.miles&&ml==null)||(r.months&&days==null))?'unknown':'ok';return {last,dm,dd,ml,days,level,label:{due:'Due',soon:'Due soon',unknown:'Needs data',ok:'On track'}[level]}}
function ruleCard(r){let s=status(r);return `<div class="card"><div class="row"><h3>${esc(r.task)}</h3><span class="status ${s.level}">${s.label}</span></div><small>${r.miles?`Every ${fmt(r.miles)} mi`:''}${r.miles&&r.months?' or ':''}${r.months?`Every ${r.months} months`:''}</small><p class="detail">${s.last?'Last: '+datefmt(s.last.date)+' · '+fmt(s.last.miles)+' mi':'No matching service recorded'}</p>${s.dm!=null?`<div>Next mileage: ${fmt(s.dm)} mi ${s.ml!=null?`<small>(${fmt(Math.abs(s.ml))} mi ${s.ml<0?'past due':'remaining'})</small>`:''}</div>`:''}${s.dd?`<div>Next date: ${datefmt(s.dd)}</div>`:''}<div class="row wrap" style="margin-top:13px">${btn('Log service','logrule:'+r.id,'secondary tiny')}${btn('Edit reminder','rule:'+r.id,'secondary tiny')}</div></div>`}
function recordCard(r){return `<div class="card"><div class="row"><h3>${esc(r.task)}</h3><strong>${cash((r.parts||0)+(r.labor||0))}</strong></div><small>${datefmt(r.date)} · ${fmt(r.miles)} mi</small>${r.brand||r.part?`<p class="detail">${esc([r.brand,r.part].filter(Boolean).join(' · '))}</p>`:''}${r.warranty?`<p class="detail">Warranty: ${esc(r.warranty)}</p>`:''}${r.notes?`<p class="detail">${esc(r.notes)}</p>`:''}<div style="margin-top:10px">${btn('Edit record','record:'+r.id,'secondary tiny')}</div></div>`}
function render(){let car=v();if(!car&&state.vehicles.length){state.active=state.vehicles[0].id;car=v()}$('#vehicleBar').innerHTML=car?`<div class="card"><label for="vehicle">ACTIVE VEHICLE</label><select id="vehicle" style="margin-bottom:6px">${state.vehicles.map(x=>`<option value="${esc(x.id)}" ${x.id===car.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="row"><div><strong>${fmt(car.miles)}${car.miles!=null?' mi':''}</strong><br><small>${car.updated?'Updated '+datefmt(car.updated):'Mileage not updated'}</small></div>${btn('Update mileage','mileage','secondary tiny')}</div></div>`:'';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';if(tab==='garage'){h=`<div class="row"><h2>Vehicles</h2>${btn('+ Add vehicle','vehicle:new')}</div>${state.vehicles.map(x=>`<div class="card row"><div><h3>${esc(x.name)}</h3><small>${fmt(x.miles)}${x.miles!=null?' mi':''}</small></div>${btn('Edit','vehicle:'+x.id,'secondary tiny')}</div>`).join('')}<h2>Data & backups</h2><div class="card"><p>Records are stored on this device. Export regularly and before changing phones.</p><div class="row wrap">${btn('Export backup','export')}${btn('Import backup','import','secondary')}</div></div>`}else if(!car){h=`<div class="card"><h2 style="margin-top:0">Start your garage</h2><p>Add a vehicle to start tracking repairs, service and mileage.</p>${btn('+ Add your first vehicle','vehicle:new')}</div>`}else if(tab==='home'){let rr=rules(), rec=records(), urgent=rr.filter(x=>['due','soon'].includes(status(x).level));h=`<div class="row wrap" style="margin:16px 0">${btn('+ Log repair / service','record:new')}${btn('+ Reminder','rule:new','secondary')}</div><div class="stats"><div class="card"><small>Due or due soon</small><div class="number">${urgent.length}</div></div><div class="card"><small>Total recorded cost</small><div class="number">${cash(rec.reduce((a,x)=>a+(x.parts||0)+(x.labor||0),0))}</div></div></div><h2>Needs attention</h2>${urgent.length?urgent.sort((a,b)=>Number(status(b).level==='due')-Number(status(a).level==='due')).map(ruleCard).join(''):'<div class="card muted">No due or upcoming reminders based on your recorded data.</div>'}${rr.filter(x=>status(x).level==='unknown').length?'<p class="notice">Some reminders need a service record or mileage before they can be calculated.</p>':''}<h2>Recent service</h2>${rec.slice(0,3).map(recordCard).join('')||'<div class="card muted">No repair records yet.</div>'}`}else if(tab==='history'){h=`<div class="row"><h2>Service history</h2>${btn('+ Log service','record:new')}</div><input id="search" placeholder="Search parts, repairs or notes" value="${esc(search)}"><div id="historyList">${historyHTML()}</div>`}else{h=`<div class="row"><h2>Maintenance</h2>${btn('+ Add reminder','rule:new')}</div><p class="notice">Set your own mileage or time intervals using your owner's manual and inspection results. Brake replacement is based on wear, not a universal mileage interval.</p>${rules().map(ruleCard).join('')||'<div class="card muted">No reminders yet. Add an oil change, tire rotation or brake inspection reminder.</div>'}`}$('#view').innerHTML=h}
function historyHTML(){return records().filter(r=>[r.task,r.brand,r.part,r.notes].join(' ').toLowerCase().includes(search.toLowerCase())).map(recordCard).join('')||'<div class="card muted">No matching service records.</div>'}
const field=(label,name,val='',type='text',attrs='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(val)}" ${attrs}></label>`, taskField=t=>`<label>Service / part name<input name="task" list="tasks" required value="${esc(t||'')}" placeholder="e.g. Rear brake pads"></label><datalist id="tasks">${[...new Set([...presets,...rules().map(r=>r.task),...records().map(r=>r.task)])].map(t=>`<option value="${esc(t)}"></option>`).join('')}</datalist>`, area=(label,name,val)=>`<label>${label}<textarea name="${name}">${esc(val)}</textarea></label>`;
function modal(title,body,submit,del){let d=$('#modal');d.innerHTML=`<div class="row"><h2 style="margin:0 0 12px">${title}</h2><button type="button" data-action="close" class="secondary tiny">Close</button></div><form id="editForm">${body}<p id="formError" class="error"></p><div class="row wrap"><button type="submit">Save</button>${del?'<button type="button" id="deleteBtn" class="danger">Delete</button>':''}</div></form>`;d.showModal();$('#editForm').onsubmit=e=>{e.preventDefault();try{submit(Object.fromEntries(new FormData(e.target)));d.close();save()}catch(err){$('#formError').textContent=err.message}};if(del)$('#deleteBtn').onclick=()=>{if(confirm('Delete this item? This cannot be undone.')){del();d.close();save()}}}
function vehicleForm(id){let old=state.vehicles.find(x=>x.id===id);modal(old?'Edit vehicle':'Add vehicle',field('Vehicle name (year, make, model)','name',old?.name,'text','required')+field('Current odometer (mi)','miles',old?.miles,'number','min="0" step="1"'),a=>{if(!a.name.trim())throw Error('Enter a vehicle name.');let x={id:old?.id||uid(),name:a.name.trim(),miles:num(a.miles),updated:a.miles!==''?today():null};if(old){if(old.miles===x.miles)x.updated=old.updated;Object.assign(old,x)}else state.vehicles.push(x);state.active=x.id},old?()=>{state.vehicles=state.vehicles.filter(x=>x.id!==id);state.records=state.records.filter(x=>x.vid!==id);state.rules=state.rules.filter(x=>x.vid!==id);if(state.active===id)state.active=state.vehicles[0]?.id||null}:null)}
function recordForm(id,task){let old=state.records.find(x=>x.id===id);modal(old?'Edit service':'Log repair / service',taskField(old?.task||task)+`<div class="formgrid">${field('Service date','date',old?.date||today(),'date','required max="'+today()+'"')}${field('Odometer (mi)','miles',old?old.miles:v()?.miles,'number','min="0" step="1"')}</div><div class="formgrid">${field('Parts cost ($)','parts',old?.parts,'number','min="0" step="0.01"')}${field('Labor cost ($)','labor',old?.labor,'number','min="0" step="0.01"')}</div>`+field('Part brand','brand',old?.brand)+field('Part number','part',old?.part)+field('Warranty details','warranty',old?.warranty)+area('Repair notes','notes',old?.notes),a=>{if(!a.task.trim())throw Error('Enter a service name.');let x={id:old?.id||uid(),vid:state.active,task:a.task.trim(),date:a.date,miles:num(a.miles),parts:num(a.parts),labor:num(a.labor),brand:a.brand,part:a.part,warranty:a.warranty,notes:a.notes};if(old)Object.assign(old,x);else state.records.push(x);let car=v();if(x.miles!=null&&(car.miles==null||x.miles>car.miles)){car.miles=x.miles;car.updated=today()}},old?()=>state.records=state.records.filter(x=>x.id!==id):null)}
function ruleForm(id){let old=state.rules.find(x=>x.id===id);modal(old?'Edit reminder':'Add reminder',taskField(old?.task)+field('Repeat every (miles, optional)','miles',old?.miles,'number','min="1" step="1"')+field('Repeat every (months, optional)','months',old?.months,'number','min="1" max="1200" step="1"')+'<p class="notice">A reminder uses the most recent service with the same name. If both intervals are entered, whichever comes first is due.</p>',a=>{if(!a.task.trim()||(!num(a.miles)&&!num(a.months)))throw Error('Enter a service name and at least one interval.');if(rules().some(r=>r.id!==id&&r.task.toLowerCase()===a.task.trim().toLowerCase()))throw Error('A reminder already exists for this service.');let x={id:old?.id||uid(),vid:state.active,task:a.task.trim(),miles:num(a.miles),months:num(a.months)};if(old)Object.assign(old,x);else state.rules.push(x)},old?()=>state.rules=state.rules.filter(x=>x.id!==id):null)}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-garage-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function validBackup(s){const n=x=>x===null||typeof x==='number'&&Number.isFinite(x)&&x>=0, str=x=>typeof x==='string', id=x=>str(x)&&/^[\w-]+$/.test(x), dt=x=>str(x)&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(new Date(x+'T12:00:00'));return s&&['vehicles','records','rules'].every(k=>Array.isArray(s[k])&&new Set(s[k].map(x=>x?.id)).size===s[k].length)&&s.vehicles.every(x=>id(x.id)&&str(x.name)&&n(x.miles)&&(x.updated===null||dt(x.updated)))&&s.records.every(x=>id(x.id)&&s.vehicles.some(v=>v.id===x.vid)&&str(x.task)&&dt(x.date)&&n(x.miles)&&n(x.parts)&&n(x.labor)&&['brand','part','warranty','notes'].every(k=>str(x[k])))&&s.rules.every(x=>id(x.id)&&s.vehicles.some(v=>v.id===x.vid)&&str(x.task)&&n(x.miles)&&n(x.months)&&(x.miles>0||x.months>0))}
$('#importFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let s=JSON.parse(await f.text());if(!validBackup(s))throw Error('Invalid My Garage backup.');if(confirm('Replace all current records with this backup?')){state=s;save()}}catch(err){alert(err.message)}finally{e.target.value=''}};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}let [a,id]= (b.dataset.action||'').split(':');if(a==='vehicle')vehicleForm(id);if(a==='record')recordForm(id);if(a==='rule')ruleForm(id);if(a==='logrule')recordForm('new',state.rules.find(x=>x.id===id).task);if(a==='close')$('#modal').close();if(a==='export')exportData();if(a==='import')$('#importFile').click();if(a==='mileage')modal('Update odometer',field('Current odometer (mi)','miles',v().miles,'number','required min="0" step="1"'),x=>{if(v().miles!=null&&Number(x.miles)<v().miles&&!confirm('This mileage is lower than the previous reading. Continue?'))throw Error('Check the odometer reading.');v().miles=Number(x.miles);v().updated=today()})});document.addEventListener('change',e=>{if(e.target.id==='vehicle'){state.active=e.target.value;search='';save()}});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('#historyList').innerHTML=historyHTML()}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
